<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Scene</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0E0603;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  svg#room {
    width: 100vw;
    height: 620px;
    display: block;
  }
</style>
</head>
<body>
<svg id="room" viewBox="0 0 1440 620" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
<defs>

  <!-- Film grain -->
  <filter id="grain" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch" result="noise"/>
    <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
    <feBlend in="SourceGraphic" in2="gray" mode="soft-light" result="blend"/>
    <feComposite in="blend" in2="SourceGraphic" operator="in"/>
  </filter>

  <!-- Soft shadow blur -->
  <filter id="shadowBlur" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>

  <!-- Plant soft blur -->
  <filter id="plantBlur" x="-5%" y="-5%" width="110%" height="110%">
    <feGaussianBlur stdDeviation="0.8"/>
  </filter>

  <!-- Subtle glow for light pool -->
  <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="40"/>
  </filter>

  <!-- Wall wood grain: back wall -->
  <pattern id="woodGrainBack" x="0" y="0" width="40" height="620" patternUnits="userSpaceOnUse">
    <rect width="40" height="620" fill="none"/>
    <line x1="3"  y1="0" x2="3"  y2="620" stroke="rgba(255,140,40,0.05)" stroke-width="0.6"/>
    <line x1="9"  y1="0" x2="9"  y2="620" stroke="rgba(255,120,20,0.04)" stroke-width="0.4"/>
    <line x1="15" y1="0" x2="15" y2="620" stroke="rgba(255,150,50,0.06)" stroke-width="0.9"/>
    <line x1="22" y1="0" x2="22" y2="620" stroke="rgba(200,100,20,0.04)" stroke-width="0.5"/>
    <line x1="30" y1="0" x2="30" y2="620" stroke="rgba(255,140,40,0.05)" stroke-width="0.7"/>
    <line x1="37" y1="0" x2="37" y2="620" stroke="rgba(180,80,10,0.03)"  stroke-width="0.4"/>
  </pattern>

  <!-- Wall wood grain: left wall -->
  <pattern id="woodGrainLeft" x="0" y="0" width="40" height="620" patternUnits="userSpaceOnUse">
    <rect width="40" height="620" fill="none"/>
    <line x1="4"  y1="0" x2="4"  y2="620" stroke="rgba(255,160,60,0.07)" stroke-width="0.7"/>
    <line x1="11" y1="0" x2="11" y2="620" stroke="rgba(255,130,30,0.05)" stroke-width="0.5"/>
    <line x1="18" y1="0" x2="18" y2="620" stroke="rgba(220,110,20,0.06)" stroke-width="0.8"/>
    <line x1="26" y1="0" x2="26" y2="620" stroke="rgba(255,140,40,0.04)" stroke-width="0.4"/>
    <line x1="33" y1="0" x2="33" y2="620" stroke="rgba(200,90,15,0.05)"  stroke-width="0.6"/>
    <line x1="38" y1="0" x2="38" y2="620" stroke="rgba(255,160,50,0.03)" stroke-width="0.3"/>
  </pattern>

  <!-- Floor radial gradient: lit center-left, dark edges -->
  <radialGradient id="floorGrad" cx="38%" cy="45%" r="62%" gradientUnits="userSpaceOnUse"
    fx="340" fy="420">
    <stop offset="0%"   stop-color="#9A6840"/>
    <stop offset="35%"  stop-color="#7A5030"/>
    <stop offset="70%"  stop-color="#5A3818"/>
    <stop offset="100%" stop-color="#3D2010"/>
  </radialGradient>

  <!-- Rug gradient -->
  <radialGradient id="rugGrad" cx="50%" cy="50%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%"   stop-color="#A0622A"/>
    <stop offset="60%"  stop-color="#7A4818"/>
    <stop offset="100%" stop-color="#5A3010"/>
  </radialGradient>

  <!-- Warm atmosphere light -->
  <radialGradient id="warmLight" cx="20%" cy="10%" r="70%" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="rgba(245,208,106,0.18)"/>
    <stop offset="100%" stop-color="rgba(245,208,106,0)"/>
  </radialGradient>

  <!-- Vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%" gradientUnits="userSpaceOnUse"
    fx="720" fy="310">
    <stop offset="30%"  stop-color="rgba(8,3,1,0)"/>
    <stop offset="70%"  stop-color="rgba(8,3,1,0.45)"/>
    <stop offset="100%" stop-color="rgba(8,3,1,0.78)"/>
  </radialGradient>

  <!-- Isometric shelf body gradient -->
  <linearGradient id="shelfTop" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#4A2E10"/>
    <stop offset="100%" stop-color="#3A2010"/>
  </linearGradient>

  <!-- Credenza top face gradient -->
  <linearGradient id="credenzaTop" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#7A5030"/>
    <stop offset="100%" stop-color="#5A3818"/>
  </linearGradient>

  <!-- Sofa top linen gradient -->
  <linearGradient id="sofaTop" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#D4C4A0"/>
    <stop offset="100%" stop-color="#B8A880"/>
  </linearGradient>

  <!-- Record platter gradient -->
  <radialGradient id="recordPlatter" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#4A3020"/>
    <stop offset="40%"  stop-color="#1A0E08"/>
    <stop offset="90%"  stop-color="#0E0804"/>
    <stop offset="100%" stop-color="#2A1808"/>
  </radialGradient>

</defs>

<!-- ═══════════════════════════════════════════
     LAYER 1: WALLS, FLOOR, CORNER
     ═══════════════════════════════════════════ -->
<g id="layer-walls">

  <!-- BACK WALL: polygon filling upper-right area -->
  <!-- Corner is at roughly x=480, y=50. Back wall goes right to x=1440 -->
  <polygon points="480,50 1440,50 1440,480 480,480"
    fill="#251408"/>
  <!-- Wood grain overlay on back wall -->
  <polygon points="480,50 1440,50 1440,480 480,480"
    fill="url(#woodGrainBack)" opacity="1"/>
  <!-- Subtle lighter band — top-left light hitting back wall -->
  <polygon points="480,50 900,50 900,480 480,480"
    fill="rgba(80,40,10,0.18)"/>

  <!-- LEFT WALL: polygon from corner going left and down -->
  <!-- Corner at 480,50. Left wall base goes to lower-left at ~0,290 -->
  <polygon points="0,0 480,50 480,480 0,380"
    fill="#3A2010"/>
  <!-- Wood grain overlay on left wall -->
  <polygon points="0,0 480,50 480,480 0,380"
    fill="url(#woodGrainLeft)" opacity="1"/>
  <!-- Left wall is lit brighter on the left (light source is top-left) -->
  <polygon points="0,0 240,25 240,430 0,340"
    fill="rgba(120,60,10,0.12)"/>

  <!-- CORNER JOIN: dark vertical line where walls meet -->
  <line x1="480" y1="50" x2="480" y2="480"
    stroke="#1A0805" stroke-width="3"/>
  <!-- Thin highlight on corner -->
  <line x1="481" y1="50" x2="481" y2="480"
    stroke="rgba(200,120,40,0.15)" stroke-width="1"/>

  <!-- FLOOR: visible parallelogram -->
  <!-- Floor occupies bottom portion: from left edge ~(0,380) sweeping right -->
  <polygon points="0,380 480,480 1440,480 1440,620 0,620"
    fill="url(#floorGrad)"/>

  <!-- Floor highlight pool: warm light from top-left -->
  <ellipse cx="320" cy="490" rx="320" ry="80"
    fill="rgba(245,200,80,0.10)" filter="url(#lightGlow)"/>

  <!-- Subtle floor plank lines -->
  <line x1="0" y1="420" x2="1440" y2="420" stroke="rgba(0,0,0,0.18)" stroke-width="0.8"/>
  <line x1="0" y1="460" x2="1440" y2="460" stroke="rgba(0,0,0,0.15)" stroke-width="0.6"/>
  <line x1="0" y1="500" x2="1440" y2="500" stroke="rgba(0,0,0,0.12)" stroke-width="0.6"/>
  <line x1="0" y1="540" x2="1440" y2="540" stroke="rgba(0,0,0,0.10)" stroke-width="0.5"/>
  <line x1="0" y1="580" x2="1440" y2="580" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>

  <!-- Floor plank diagonals following isometric perspective -->
  <line x1="200" y1="380" x2="0"    y2="440"  stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <line x1="500" y1="480" x2="200"  y2="580"  stroke="rgba(0,0,0,0.07)" stroke-width="0.5"/>
  <line x1="800" y1="480" x2="500"  y2="620"  stroke="rgba(0,0,0,0.06)" stroke-width="0.5"/>
  <line x1="1100" y1="480" x2="900" y2="620"  stroke="rgba(0,0,0,0.05)" stroke-width="0.5"/>

</g>

<!-- ═══════════════════════════════════════════
     FRAMED ARTWORKS — back wall
     ═══════════════════════════════════════════ -->
<g id="layer-frames">

  <!-- Frame 1: left section of back wall, slightly rotated -->
  <g transform="translate(560,110) rotate(-1.2)">
    <!-- Shadow behind frame -->
    <rect x="3" y="4" width="82" height="105" rx="1" fill="rgba(0,0,0,0.35)" filter="url(#shadowBlur)"/>
    <!-- Walnut outer frame -->
    <rect x="0" y="0" width="82" height="105" rx="1" fill="#3A2010"/>
    <!-- Inner mat -->
    <rect x="5" y="5" width="72" height="95" fill="#8A7A68"/>
    <!-- Artwork: warm abstract wash -->
    <rect x="8" y="8" width="66" height="89" fill="#6A5840"/>
    <rect x="8" y="8" width="66" height="40" fill="rgba(180,120,40,0.3)"/>
    <rect x="8" y="48" width="66" height="49" fill="rgba(40,20,5,0.2)"/>
    <!-- Abstract horizontal strokes suggesting landscape -->
    <line x1="14" y1="38" x2="68" y2="38" stroke="rgba(200,140,60,0.5)" stroke-width="2"/>
    <line x1="14" y1="52" x2="68" y2="52" stroke="rgba(80,40,10,0.6)"   stroke-width="1.5"/>
    <line x1="14" y1="62" x2="60" y2="62" stroke="rgba(60,30,5,0.5)"    stroke-width="1"/>
    <!-- Frame inner edge shadow -->
    <rect x="5" y="5" width="72" height="95" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
  </g>

  <!-- Frame 2: center back wall, taller -->
  <g transform="translate(720,90) rotate(0.8)">
    <rect x="3" y="4" width="72" height="120" rx="1" fill="rgba(0,0,0,0.35)" filter="url(#shadowBlur)"/>
    <rect x="0" y="0" width="72" height="120" rx="1" fill="#3A2010"/>
    <rect x="5" y="5" width="62" height="110" fill="#8A7A68"/>
    <rect x="8" y="8" width="56" height="104" fill="#5A4830"/>
    <!-- Warm abstract: vertical forms -->
    <rect x="8"  y="8" width="18" height="104" fill="rgba(160,80,20,0.4)"/>
    <rect x="30" y="8" width="12" height="104" fill="rgba(200,140,60,0.25)"/>
    <rect x="46" y="8" width="18" height="104" fill="rgba(80,40,10,0.3)"/>
    <line x1="8"  y1="60" x2="64" y2="60" stroke="rgba(220,160,60,0.35)" stroke-width="1.5"/>
    <line x1="8"  y1="75" x2="64" y2="75" stroke="rgba(40,15,3,0.4)"     stroke-width="1"/>
    <rect x="5" y="5" width="62" height="110" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="1"/>
  </g>

  <!-- Frame 3: right section, closer to corner -->
  <g transform="translate(870,120) rotate(1.5)">
    <rect x="3" y="4" width="90" height="90" rx="1" fill="rgba(0,0,0,0.35)" filter="url(#shadowBlur)"/>
    <rect x="0" y="0" width="90" height="90" rx="1" fill="#3A2010"/>
    <rect x="5" y="5" width="80" height="80" fill="#8A7A68"/>
    <rect x="8" y="8" width="74" height="74" fill="#4A3820"/>
    <!-- Abstract: warm block composition -->
    <rect x="8"  y="8"  width="74" height="35" fill="rgba(140,80,20,0.45)"/>
    <rect x="8"  y="47" width="35" height="35" fill="rgba(80,100,40,0.3)"/>
    <rect x="47" y="47" width="35" height="35" fill="rgba(180,90,20,0.35)"/>
    <rect x="5" y="5" width="80" height="80" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="1"/>
  </g>

</g>

<!-- ═══════════════════════════════════════════
     LAYER 2: FLOOR SHADOWS (all objects)
     ═══════════════════════════════════════════ -->
<g id="layer-shadows" filter="url(#shadowBlur)" opacity="0.5">

  <!-- Bookshelf shadow -->
  <ellipse cx="155" cy="475" rx="80" ry="18" fill="rgba(10,3,0,0.7)"/>

  <!-- Credenza shadow -->
  <ellipse cx="1050" cy="490" rx="180" ry="20" fill="rgba(10,3,0,0.65)"/>

  <!-- Sofa shadow -->
  <ellipse cx="760" cy="515" rx="200" ry="22" fill="rgba(10,3,0,0.6)"/>

  <!-- Coffee table shadow -->
  <ellipse cx="720" cy="545" rx="100" ry="14" fill="rgba(10,3,0,0.55)"/>

  <!-- Eames chair shadow -->
  <ellipse cx="430" cy="510" rx="90" ry="16" fill="rgba(10,3,0,0.6)"/>

  <!-- Plant corner left shadow -->
  <ellipse cx="60"  cy="488" rx="45" ry="12" fill="rgba(10,3,0,0.55)"/>

  <!-- Plant corner right shadow -->
  <ellipse cx="1360" cy="488" rx="45" ry="12" fill="rgba(10,3,0,0.50)"/>

</g>

<!-- ═══════════════════════════════════════════
     LAYER 3: FURNITURE
     ═══════════════════════════════════════════ -->
<g id="layer-furniture">

  <!-- ─────────────────────────────────────────
       BOOKSHELF — left wall, isometric 3-face
       ───────────────────────────────────────── -->
  <g id="bookshelf">
    <!-- Shelf body: three isometric faces -->
    <!-- Back/left face (darkest — in shadow) -->
    <polygon points="80,140 130,110 130,460 80,490"
      fill="#1A0C06"/>
    <!-- Front face (mid-tone, faces viewer) -->
    <polygon points="80,490 130,460 230,460 180,490"
      fill="#2A1608"/>
    <!-- Left visible face (angled to left wall, slightly lighter) -->
    <!-- Actually the top face -->
    <polygon points="80,140 130,110 230,110 180,140"
      fill="#4A2E12"/>

    <!-- Right face (front-facing, mid-tone) -->
    <polygon points="130,110 230,110 230,460 130,460"
      fill="#2E1A0A"/>

    <!-- Shelf dividers (horizontal shelves — 3 zones) -->
    <!-- Shelf 1 divider at y≈210 -->
    <polygon points="80,210 130,185 230,185 180,210" fill="#1A0C06"/>
    <rect x="130" y="185" width="100" height="4"     fill="#3A2010"/>
    <!-- Shelf 2 divider at y≈310 -->
    <polygon points="80,310 130,285 230,285 180,310" fill="#1A0C06"/>
    <rect x="130" y="285" width="100" height="4"     fill="#3A2010"/>
    <!-- Shelf 3 divider at y≈380 -->
    <polygon points="80,380 130,355 230,355 180,380" fill="#1A0C06"/>
    <rect x="130" y="355" width="100" height="4"     fill="#3A2010"/>

    <!-- ── TOP SHELF: 5 film sleeves / spines ── -->
    <!-- Sleeve 1: burgundy -->
    <rect x="133" y="120" width="14" height="62" rx="1" fill="#5A1820"/>
    <rect x="133" y="120" width="14" height="3"  rx="0" fill="#8A3040"/>
    <!-- Sleeve 2: navy -->
    <rect x="150" y="118" width="16" height="64" rx="1" fill="#0E1E3A"/>
    <rect x="150" y="118" width="16" height="3"  rx="0" fill="#1A3060"/>
    <!-- Sleeve 3: near-black -->
    <rect x="169" y="122" width="12" height="60" rx="1" fill="#0E0C0A"/>
    <rect x="169" y="122" width="12" height="3"  rx="0" fill="#2A2018"/>
    <!-- Sleeve 4: forest green -->
    <rect x="184" y="119" width="15" height="63" rx="1" fill="#1A3018"/>
    <rect x="184" y="119" width="15" height="3"  rx="0" fill="#2A5028"/>
    <!-- Sleeve 5: plum -->
    <rect x="202" y="121" width="14" height="61" rx="1" fill="#3A1030"/>
    <rect x="202" y="121" width="14" height="3"  rx="0" fill="#5A2050"/>

    <!-- ── MIDDLE SHELF: 5 vinyl records (squares) ── -->
    <!-- Record 1 -->
    <rect x="133" y="200" width="16" height="16" rx="0" fill="#1A0E08"/>
    <rect x="136" y="203" width="10" height="10" rx="0" fill="#8A1820"/>
    <circle cx="141" cy="208" r="2" fill="#1A0E08"/>
    <!-- Record 2 -->
    <rect x="152" y="198" width="16" height="16" rx="0" fill="#1A0E08"/>
    <rect x="155" y="201" width="10" height="10" rx="0" fill="#0E2050"/>
    <circle cx="160" cy="206" r="2" fill="#1A0E08"/>
    <!-- Record 3 -->
    <rect x="171" y="200" width="16" height="16" rx="0" fill="#1A0E08"/>
    <rect x="174" y="203" width="10" height="10" rx="0" fill="#1A3018"/>
    <circle cx="179" cy="208" r="2" fill="#1A0E08"/>
    <!-- Record 4 -->
    <rect x="190" y="199" width="16" height="16" rx="0" fill="#1A0E08"/>
    <rect x="193" y="202" width="10" height="10" rx="0" fill="#4A3010"/>
    <circle cx="198" cy="207" r="2" fill="#1A0E08"/>
    <!-- Record 5 -->
    <rect x="209" y="200" width="16" height="16" rx="0" fill="#1A0E08"/>
    <rect x="212" y="203" width="10" height="10" rx="0" fill="#3A0E28"/>
    <circle cx="217" cy="208" r="2" fill="#1A0E08"/>

    <!-- ── LOWER SHELF: cameras ── -->
    <!-- Camera 1: large boxy SLR -->
    <g transform="translate(133,295)">
      <!-- Body -->
      <rect x="0" y="10" width="48" height="32" rx="2" fill="#1E1408"/>
      <!-- Pentaprism hump -->
      <rect x="14" y="0" width="20" height="14" rx="1" fill="#160E05"/>
      <!-- Lens ring -->
      <circle cx="24" cy="26" r="10" fill="#0A0804" stroke="#2A2010" stroke-width="1.5"/>
      <circle cx="24" cy="26" r="6"  fill="#080604"/>
      <circle cx="24" cy="26" r="3"  fill="rgba(100,140,200,0.3)"/>
      <!-- Top face of body -->
      <polygon points="0,10 48,10 60,0 12,0" fill="#2A1A0A"/>
      <!-- Shutter button -->
      <circle cx="42" cy="8" r="3" fill="#3A2810"/>
      <!-- Side face -->
      <polygon points="48,10 60,0 60,42 48,42" fill="#140C04"/>
    </g>

    <!-- Camera 2: small compact -->
    <g transform="translate(185,300)">
      <!-- Body -->
      <rect x="0" y="6" width="34" height="22" rx="3" fill="#1A1208"/>
      <!-- Top face -->
      <polygon points="0,6 34,6 40,0 6,0" fill="#2A1A0A"/>
      <!-- Side face -->
      <polygon points="34,6 40,0 40,28 34,28" fill="#120C04"/>
      <!-- Lens: small circle -->
      <circle cx="12" cy="17" r="7" fill="#0A0804" stroke="#2A2010" stroke-width="1"/>
      <circle cx="12" cy="17" r="4" fill="#060402"/>
      <circle cx="12" cy="17" r="2" fill="rgba(80,120,180,0.25)"/>
      <!-- Flash: small rectangle -->
      <rect x="22" y="10" width="8" height="5" rx="1" fill="#3A3020" stroke="#4A4030" stroke-width="0.5"/>
    </g>

    <!-- Shelf depth shadow line -->
    <line x1="130" y1="110" x2="130" y2="460" stroke="rgba(0,0,0,0.4)" stroke-width="1.5"/>
  </g>

  <!-- ─────────────────────────────────────────
       RUG — under coffee table
       ───────────────────────────────────────── -->
  <g id="rug">
    <!-- Organic irregular shape -->
    <path d="
      M580,540
      C590,520 620,510 660,512
      C700,514 740,508 780,510
      C820,512 860,508 880,515
      C900,522 890,535 870,542
      C850,549 820,548 790,550
      C760,552 730,555 700,554
      C670,553 640,552 610,548
      C585,544 570,555 580,540 Z
    " fill="#7A4818" opacity="0.9"/>
    <!-- Rug pattern lines -->
    <path d="M620,530 C650,526 700,524 750,526 C800,528 840,530 860,533"
      stroke="rgba(180,100,30,0.4)" stroke-width="1.5" fill="none"/>
    <path d="M615,538 C645,534 695,532 745,534 C795,536 840,537 858,540"
      stroke="rgba(120,60,10,0.35)" stroke-width="1" fill="none"/>
    <path d="M625,524 C655,520 705,518 750,520 C800,522 840,524 860,527"
      stroke="rgba(200,120,40,0.3)" stroke-width="1" fill="none"/>
    <!-- Abstract geometric motif center -->
    <path d="M700,528 L720,524 L740,528 L720,532 Z" fill="rgba(180,90,20,0.5)"/>
    <path d="M700,528 L720,536 L740,528 L720,520 Z" fill="rgba(140,60,10,0.4)"/>
    <!-- Border suggestion -->
    <path d="
      M582,540
      C591,521 622,512 661,514
      C701,516 741,509 781,511
      C821,513 861,509 881,516
      C901,524 891,537 869,543
    " stroke="rgba(160,80,20,0.3)" stroke-width="2" fill="none"/>
  </g>

  <!-- ─────────────────────────────────────────
       SOFA — center, isometric 3-face
       Wide, low, deep linen sofa
       ───────────────────────────────────────── -->
  <g id="sofa">
    <!-- SOFA BASE SHADOW under legs -->
    <rect x="558" y="510" width="408" height="8" rx="2" fill="rgba(0,0,0,0.3)"/>

    <!-- LEFT ARMREST: 3 faces -->
    <!-- Top face -->
    <polygon points="558,450 598,425 618,425 578,450" fill="#C8B890"/>
    <!-- Front face -->
    <polygon points="558,450 578,450 578,520 558,520" fill="#A89878"/>
    <!-- Side face (right) -->
    <polygon points="578,450 618,425 618,495 578,520" fill="#8A7A60"/>

    <!-- RIGHT ARMREST: 3 faces -->
    <!-- Top face -->
    <polygon points="902,450 942,425 962,425 922,450" fill="#C4B488"/>
    <!-- Front face -->
    <polygon points="902,450 922,450 922,520 902,520" fill="#A89878"/>
    <!-- Side face -->
